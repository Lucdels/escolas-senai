<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0033A0">
    <meta name="description" content="Localizador de Escolas SENAI-RS - 4ª Feira do Jovem Aprendiz">
    <title>SENAI-RS | Encontre sua Escola</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNFTkFJLVJTIEVzY29sYXMiLAogICJzaG9ydF9uYW1lIjogIlNFTkFJIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNGRkZGRkYiLAogICJ0aGVtZV9jb2xvciI6ICIjMDAzM0EwIgp9">
    <style>
        :root {
            --senai-blue: #0033A0;
            --senai-orange: #FF6600;
            --bg-gray: #F8F9FA;
            --text-dark: #1A1A1A;
            --white: #FFFFFF;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --touch-target: 44px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-dark); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        
        .skip-link { position: absolute; top: -40px; left: 0; background: var(--senai-orange); color: white; padding: 8px; z-index: 100; transition: top 0.3s; }
        .skip-link:focus { top: 0; }

        header { background: var(--white); padding: 1rem; border-bottom: 4px solid var(--senai-blue); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 50; }
        .logo-container { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .logo-senai { font-weight: 900; font-size: 28px; color: var(--senai-blue); letter-spacing: -1px; }
        .logo-fiergs { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; border-left: 1px solid #ddd; padding-left: 15px; line-height: 1.2; }

        .banner { background: linear-gradient(135deg, var(--senai-blue) 0%, #001f60 100%); color: var(--white); padding: 40px 20px 60px; text-align: center; }
        .banner h1 { font-size: 24px; margin-bottom: 8px; font-weight: 800; }
        
        .container { max-width: 650px; margin: 0 auto; padding: 0 20px 40px; }
        
        .search-card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: var(--shadow); margin-top: -30px; }
        .input-group { position: relative; margin-bottom: 15px; }
        
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--senai-blue); }
        input, select { width: 100%; min-height: var(--touch-target); padding: 12px 16px; border: 2px solid #E0E0E0; border-radius: 10px; font-size: 16px; transition: 0.2s; outline: none; }
        input:focus, select:focus { border-color: var(--senai-blue); box-shadow: 0 0 0 3px rgba(0,51,160,0.1); }

        .autocomplete-list { position: absolute; background: var(--white); width: 100%; border: 1px solid #ddd; z-index: 1000; max-height: 250px; overflow-y: auto; border-radius: 0 0 10px 10px; box-shadow: var(--shadow); }
        .autocomplete-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #F0F0F0; font-size: 15px; }
        .autocomplete-item:hover { background: #F8F9FA; color: var(--senai-blue); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { min-height: var(--touch-target); padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; transition: transform 0.1s; text-decoration: none; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--senai-blue); color: white; }
        .btn-outline { background: white; border: 2px solid var(--senai-blue); color: var(--senai-blue); }
        .btn-full { grid-column: span 2; background: #f0f0f0; color: #444; }

        .results { margin-top: 25px; }
        .card { background: var(--white); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border-left: 8px solid var(--senai-orange); animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header { margin-bottom: 15px; border-bottom: 1px solid #EEE; padding-bottom: 10px; }
        .card-tag { display: inline-block; background: #E3F2FD; color: var(--senai-blue); font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 5px; }
        .card-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }
        
        .info-row { display: flex; gap: 10px; margin-bottom: 12px; font-size: 14px; }
        .info-icon { min-width: 20px; color: #777; }
        
        .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .btn-action { font-size: 12px; padding: 10px; border-radius: 8px; color: white; text-align: center; text-decoration: none; font-weight: 700; }
        .bg-call { background: #28a745; }
        .bg-wa { background: #25D366; }
        .bg-map { background: var(--senai-blue); }
        .bg-mail { background: #6c757d; }

        .qr-section { text-align: center; margin-top: 40px; padding: 30px; background: #FFF; border-radius: 16px; border: 2px dashed #DDD; }
        footer { text-align: center; padding: 40px 20px; color: #888; font-size: 13px; }

        @media (max-width: 480px) {
            .btn-grid { grid-template-columns: 1fr; }
            .btn-full { grid-column: span 1; }
            .actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo</a>
    
    <header>
        <div class="logo-container">
            <div class="logo-senai" aria-label="SENAI">SENAI</div>
            <div class="logo-fiergs">Sistema<br>FIERGS</div>
        </div>
    </header>

    <main id="main-content">
        <div class="banner">
            <h1>4ª Feira do Jovem Aprendiz</h1>
            <p>Encontre a unidade SENAI mais próxima de você</p>
        </div>

        <div class="container">
            <div class="search-card">
                <div class="input-group">
                    <label for="citySearch">Busque por Município</label>
                    <input type="text" id="citySearch" placeholder="Ex: Porto Alegre, Caxias..." aria-autocomplete="list">
                    <div id="autocompleteList" class="autocomplete-list" hidden></div>
                </div>

                <div class="input-group">
                    <label for="regionFilter">Filtrar por Sub-região</label>
                    <select id="regionFilter">
                        <option value="">Todas as sub-regiões</option>
                    </select>
                </div>

                <div class="btn-grid">
                    <button class="btn btn-outline" onclick="getLocation()" aria-label="Usar minha localização">📍 Minha Localização</button>
                    <button class="btn btn-primary" onclick="searchByInput()">🔍 Buscar</button>
                    <button class="btn btn-full" onclick="listarTodos()">📋 Ver todos os municípios</button>
                </div>
            </div>

            <div id="resultsArea" class="results"></div>

            <div class="qr-section">
                <p style="font-weight: 700; margin-bottom: 15px;">Leve o SENAI com você</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://www.senairs.org.br" alt="QR Code para o site do SENAI" width="140" height="140">
                <p style="font-size: 12px; color: #999; margin-top: 10px;">Escaneie para acessar o portal oficial</p>
            </div>
        </div>
    </main>

    <footer>
        <p><strong>SENAI Rio Grande do Sul &copy; 2026</strong></p>
        <p>PWA desenvolvido para a 4ª Feira do Jovem Aprendiz</p>
    </footer>

    <script>
        // Fallback de dados principais (Offline/Erro de Fetch)
        const REGIOES = [
            { reg: 'DIGITAL', coord: 'Gilberto Garcia Torman Junior', email: 'gilberto.torman@senairs.org.br', escola: 'CFP SENAI DIGITAL', end: 'Atendimento Online', tel: '0800 051 8555', lat: -30.01, lon: -51.15 },
            { reg: 'Metropolitana 1', coord: 'Bruna Magda Michel', email: 'bruna.michel@senairs.org.br', escola: 'CFP SENAI VISCONDE DE MAUÁ', end: 'Av. Sertório, 473, Porto Alegre', tel: '5139042615', lat: -29.997, lon: -51.192 },
            { reg: 'Metropolitana 2', coord: 'Michel Anderson Zinth', email: 'michel.zinth@senairs.org.br', escola: 'CFP SENAI NEY DAMASCENO FERREIRA', end: 'Av. Plínio G. Kröeff, 401, Gravataí', tel: '5133901551', lat: -29.932, lon: -51.012 },
            { reg: 'Serra 1', coord: 'Evandro de Lima', email: 'evandro.lima@senairs.org.br', escola: 'CFP SENAI JOSÉ GAZOLA', end: 'Rua José Gazola, 1155, Caxias do Sul', tel: '5432212555', lat: -29.167, lon: -51.179 }
        ];

        let baseDados = [];
        const normalize = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();

        // Carregamento de Dados
        async function loadData() {
            try {
                const response = await fetch('dados_municipios_senai.csv');
                if (!response.ok) throw new Error();
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                baseDados = rows.map(row => {
                    const cols = row.split(',');
                    return { mun: cols[0], reg: cols[1], coord: cols[2], email: cols[3], escola: cols[4], end: cols[5], tel: cols[6], lat: parseFloat(cols[7]), lon: parseFloat(cols[8]) };
                }).filter(i => i.mun);
            } catch (e) {
                console.warn('Usando fallback de dados.');
                baseDados = REGIOES.map(r => ({ mun: r.reg, ...r }));
            }
            populateFilters();
        }

        function populateFilters() {
            const select = document.getElementById('regionFilter');
            const uniqueRegs = [...new Set(baseDados.map(i => i.reg))].sort();
            uniqueRegs.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                select.appendChild(opt);
            });
        }

        // Autocomplete
        const input = document.getElementById('citySearch');
        const list = document.getElementById('autocompleteList');

        input.addEventListener('input', () => {
            const val = normalize(input.value);
            list.innerHTML = '';
            if (val.length < 2) { list.hidden = true; return; }
            
            const matches = baseDados.filter(i => normalize(i.mun).includes(val)).slice(0, 6);
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = m.mun;
                div.onclick = () => { input.value = m.mun; list.hidden = true; renderCards([m]); };
                list.appendChild(div);
            });
            list.hidden = matches.length === 0;
        });

        // Geolocalização e Haversine
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Raio da Terra em km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getLocation() {
            if (!navigator.geolocation) return alert('Geolocalização não suportada.');
            
            document.getElementById('resultsArea').innerHTML = '<p style="text-align:center">Calculando distância real...</p>';
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                
                // Tenta Nominatim para nome da cidade, mas prioriza distância matemática
                const sorted = baseDados
                    .filter(i => i.lat && i.lon)
                    .map(i => ({ ...i, dist: calculateDistance(latitude, longitude, i.lat, i.lon) }))
                    .sort((a, b) => a.dist - b.dist);
                
                renderCards(sorted.slice(0, 5), 'Escolas mais próximas de você');
            }, () => {
                alert('Não foi possível obter sua localização.');
            });
        }

        function renderCards(items, title = 'Resultados Encontrados') {
            const area = document.getElementById('resultsArea');
            if (items.length === 0) {
                area.innerHTML = '<div class="card">Nenhum resultado encontrado.</div>';
                return;
            }

            area.innerHTML = `<h3 style="margin-bottom:15px; font-size:16px; color:#666">${title}</h3>`;
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-tag">${item.reg}</span>
                        <div class="card-title">${item.mun}</div>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">👤</span>
                        <div><strong>Coord:</strong> ${item.coord}</div>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">🏫</span>
                        <div><strong>Escola:</strong> ${item.escola}</div>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">📍</span>
                        <div>${item.end} ${item.dist ? `<br><small>Aprox. ${item.dist.toFixed(1)} km de você</small>` : ''}</div>
                    </div>
                    <div class="actions">
                        <a href="tel:${item.tel}" class="btn-action bg-call">Ligar</a>
                        <a href="https://wa.me/55${item.tel.replace(/\D/g,'')}" class="btn-action bg-wa">WhatsApp</a>
                        <a href="https://www.google.com/maps/search/${encodeURIComponent(item.escola + ' ' + item.end)}" target="_blank" class="btn-action bg-map">Ver Mapa</a>
                        <a href="mailto:${item.email}" class="btn-action bg-mail">E-mail</a>
                    </div>
                `;
                area.appendChild(card);
            });
        }

        function searchByInput() {
            const val = normalize(input.value);
            const reg = document.getElementById('regionFilter').value;
            let filtered = baseDados;
            
            if (val) filtered = filtered.filter(i => normalize(i.mun).includes(val));
            if (reg) filtered = filtered.filter(i => i.reg === reg);
            
            renderCards(filtered);
        }

        function listarTodos() {
            const sorted = [...baseDados].sort((a, b) => a.mun.localeCompare(b.mun));
            renderCards(sorted, 'Todos os Municípios (Ordem Alfabética)');
        }

        // Service Worker para Offline
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'senai-v1';
                self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.add(location.href))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        window.onload = loadData;
    </script>
</body>
</html>
