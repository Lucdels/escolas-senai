<head>

<meta name="description" content="Localizador de Escolas SENAI-RS - 4ª Feira do Jovem Aprendiz">

<style>
:root {
  --senai-blue: #0033A0;
  --senai-orange: #FF6600;
  --bg-gray: #F8F9FA;
  --text-dark: #1A1A1A;
  --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --touch-target: 44px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background-color: var(--bg-gray); color: var(--text-dark); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.skip-link { position: absolute; top: -40px; left: 0; background: var(--senai-orange); color: white; padding: 8px; z-index: 100; transition: top 0.3s; }
.skip-link:focus { top: 0; }
header { background: var(--white); padding: 1rem; border-bottom: 4px solid var(--senai-blue); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 50; }
.logo-container { display: flex; justify-content: center; align-items: center; gap: 15px; }
.logo-senai { font-weight: 900; font-size: 28px; color: var(--senai-blue); letter-spacing: -1px; }
.logo-fiergs { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; border-left: 1px solid #ddd; padding-left: 15px; line-height: 1.2; }
.banner { background: linear-gradient(135deg, var(--senai-blue) 0%, #001f60 100%); color: var(--white); padding: 40px 20px 60px; text-align: center; }
.banner h1 { font-size: 24px; margin-bottom: 8px; font-weight: 800; }
.container { max-width: 650px; margin: 0 auto; padding: 0 20px 40px; }
.search-card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: var(--shadow); margin-top: -30px; }
.input-group { position: relative; margin-bottom: 15px; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--senai-blue); }
input, select { width: 100%; min-height: var(--touch-target); padding: 12px 16px; border: 2px solid #E0E0E0; border-radius: 10px; font-size: 16px; transition: 0.2s; outline: none; }
input:focus, select:focus { border-color: var(--senai-blue); box-shadow: 0 0 0 3px rgba(0,51,160,0.1); }
.autocomplete-list { position: absolute; background: var(--white); width: 100%; border: 1px solid #ddd; z-index: 1000; max-height: 250px; overflow-y: auto; border-radius: 0 0 10px 10px; box-shadow: var(--shadow); }
.autocomplete-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #F0F0F0; font-size: 15px; }
.autocomplete-item:hover { background: #F8F9FA; color: var(--senai-blue); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.btn { min-height: var(--touch-target); padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; transition: transform 0.1s; text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--senai-blue); color: white; }
.btn-outline { background: white; border: 2px solid var(--senai-blue); color: var(--senai-blue); }
.btn-full { grid-column: span 2; background: #f0f0f0; color: #444; }
.results { margin-top: 25px; }
.card { background: var(--white); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border-left: 8px solid var(--senai-orange); animation: slideUp 0.4s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.card-header { margin-bottom: 15px; border-bottom: 1px solid #EEE; padding-bottom: 10px; }
.card-tag { display: inline-block; background: #E3F2FD; color: var(--senai-blue); font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 5px; }
.card-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }
.info-row { display: flex; gap: 10px; margin-bottom: 12px; font-size: 14px; }
.info-icon { min-width: 20px; color: #777; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
.btn-action { font-size: 12px; padding: 10px; border-radius: 8px; color: white; text-align: center; text-decoration: none; font-weight: 700; }
.bg-call { background: #28a745; }
.bg-wa { background: #25D366; }
.bg-map { background: var(--senai-blue); }
.bg-mail { background: #6c757d; }
.qr-section { text-align: center; margin-top: 40px; padding: 30px; background: #FFF; border-radius: 16px; border: 2px dashed #DDD; }
footer { text-align: center; padding: 40px 20px; color: #888; font-size: 13px; }
@media (max-width: 480px) {
  .btn-grid { grid-template-columns: 1fr; }
  .btn-full { grid-column: span 1; }
  .actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteúdo</a>
<header>
  <div class="logo-container">
    <div class="logo-senai" aria-label="SENAI">SENAI</div>
    <div class="logo-fiergs">Sistema<br>FIERGS</div>
  </div>
</header>
<main id="main-content">
  <div class="banner">
    <h1>4ª Feira do Jovem Aprendiz</h1>
    <p>Encontre a unidade SENAI mais próxima de você</p>
  </div>
  <div class="container">
    <div class="search-card">
      <div class="input-group">
        <label for="citySearch">Busque por Município</label>
        <input type="text" id="citySearch" placeholder="Ex: Porto Alegre, Caxias..." aria-autocomplete="list">
        <div id="autocompleteList" class="autocomplete-list" hidden></div>
      </div>
      <div class="input-group">
        <label for="regionFilter">Filtrar por Sub-região</label>
        <select id="regionFilter">
          <option value="">Todas as sub-regiões</option>
        </select>
      </div>
      <div class="btn-grid">
        <button class="btn btn-outline" onclick="getLocation()" aria-label="Usar minha localização">📍 Minha Localização</button>
        <button class="btn btn-primary" onclick="searchByInput()">🔍 Buscar</button>
        <button class="btn btn-full" onclick="listarTodos()">📋 Ver todos os municípios</button>
      </div>
    </div>
    <div id="resultsArea" class="results"></div>
    <div class="qr-section">
      <p style="font-size:14px;color:#666">Escaneie para abrir este aplicativo no seu celular</p>
    </div>
  </div>
</main>
<footer>
  <p>© 2026 SENAI-RS · Sistema FIERGS · 4ª Feira do Jovem Aprendiz</p>
</footer>

<script>
// ===== UTILITÁRIOS =====
let REGISTROS = [];
let CIDADES = [];
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

// ===== PARSER DE CSV ROBUSTO =====
function detectarDelimitador(texto){
  const amostra = texto.slice(0, 5000);
  const virgulas = (amostra.match(/,/g)||[]).length;
  const pontoEVirgula = (amostra.match(/;/g)||[]).length;
  return pontoEVirgula > virgulas ? ';' : ',';
}

function parseCSV(texto){
  const delim = detectarDelimitador(texto);
  const linhas = [];
  let atual = '', campo = false;
  for(let i=0;i<texto.length;i++){
    const c = texto[i];
    if(c === '"'){ campo = !campo; }
    else if(c === '\n' && !campo){ linhas.push(atual); atual = ''; }
    else if(c === '\r' && !campo){ /* ignora */ }
    else { atual += c; }
  }
  if(atual.trim()) linhas.push(atual);
  return linhas.map(l => {
    const cols = []; let cur = '', q = false;
    for(let i=0;i<l.length;i++){
      const ch = l[i];
      if(ch === '"'){ q = !q; }
      else if(ch === delim && !q){ cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// Mapeia colunas pelo cabeçalho; se não houver cabeçalho, usa posição fixa
function mapearColunas(rows){
  const primeiro = rows[0].map(c => norm(c));
  const temCabecalho = primeiro.some(c => c.includes('MUNICIP'));
  if(!temCabecalho){
    return { inicio: 0, idx: { municipio:0, sub_regiao:1, coordenador:2, email:3, escola:4, endereco:5 } };
  }
  const achar = nomes => primeiro.findIndex(c => nomes.some(n => c.includes(n)));
  return {
    inicio: 1,
    idx: {
      municipio:   achar(['MUNICIP']),
      sub_regiao:  achar(['SUB']),
      coordenador: achar(['COORDENADOR','NOME']),
      email:       achar(['EMAIL','E-MAIL','MAIL']),
      escola:      achar(['ESCOLA','UNIDADE']),
      endereco:    achar(['ENDERECO','END'])
    }
  };
}

// Decodifica bytes: tenta UTF-8; se houver caracteres corrompidos, tenta ANSI (windows-1252)
function decodificar(buf){
  let texto = new TextDecoder('utf-8').decode(buf);
  if(texto.indexOf('\uFFFD') !== -1){
    texto = new TextDecoder('windows-1252').decode(buf);
  }
  return texto.replace(/^\uFEFF/,'');
}

function carregarDados(){
  fetch('dados_municipios_senai.csv')
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(buf => {
      const texto = decodificar(buf);
      const rows = parseCSV(texto);
      const { inicio, idx } = mapearColunas(rows);
      const pegar = (r, i) => (i >= 0 && r[i] !== undefined) ? r[i].trim() : '';

      REGISTROS = rows.slice(inicio).filter(r => pegar(r, idx.municipio)).map(r => ({
        municipio:   pegar(r, idx.municipio),
        sub_regiao:  pegar(r, idx.sub_regiao),
        coordenador: pegar(r, idx.coordenador),
        email:       pegar(r, idx.email),
        escola:      pegar(r, idx.escola),
        endereco:    pegar(r, idx.endereco)
      }));

      // Deduplica municípios por chave normalizada (ignora acentos, caixa e espaços)
      const mapa = new Map();
      REGISTROS.forEach(r => {
        const k = norm(r.municipio);
        if(!mapa.has(k)) mapa.set(k, r.municipio);
      });
      CIDADES = [...mapa.values()].sort((a,b) => a.localeCompare(b,'pt-BR'));

      montarFiltroRegioes();
      console.log('Carregados '+REGISTROS.length+' registros, '+CIDADES.length+' municípios únicos');
    })
    .catch(err => {
      console.error('Falha ao carregar dados:', err);
      alert('Não foi possível carregar os dados. Verifique se dados_municipios_senai.csv está na mesma pasta do index.html.');
    });
}

function montarFiltroRegioes(){
  const sel = document.getElementById('regionFilter');
  const regs = [...new Set(REGISTROS.map(r => r.sub_regiao))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  regs.forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r; sel.appendChild(o);
  });
}

// ===== AUTOCOMPLETE =====
const citySearch = document.getElementById('citySearch');
const autocompleteList = document.getElementById('autocompleteList');
const regionFilter = document.getElementById('regionFilter');
const resultsArea = document.getElementById('resultsArea');

citySearch.addEventListener('input', () => {
  const q = norm(citySearch.value.trim());
  autocompleteList.innerHTML = ''; autocompleteList.hidden = true;
  if(!q) return;
  const matches = CIDADES.filter(c => norm(c).includes(q)).slice(0, 8);
  if(!matches.length) return;
  autocompleteList.hidden = false;
  matches.forEach(m => {
    const d = document.createElement('div');
    d.className = 'autocomplete-item';
    d.textContent = m;
    d.addEventListener('click', () => {
      citySearch.value = m;
      autocompleteList.hidden = true;
      buscarMunicipio(m);
    });
    autocompleteList.appendChild(d);
  });
});
document.addEventListener('click', e => {
  if(!e.target.closest('.input-group')) autocompleteList.hidden = true;
});

// ===== BUSCA =====
function buscarMunicipio(nome){
  const regs = REGISTROS.filter(r => norm(r.municipio) === norm(nome));
  renderizar(regs, nome);
}
function searchByInput(){
  const q = norm(citySearch.value.trim());
  if(!q){ listarTodos(); return; }
  const regs = REGISTROS.filter(r => norm(r.municipio).includes(q) || norm(r.sub_regiao).includes(q));
  renderizar(regs, citySearch.value.trim());
}
function listarTodos(){
  let html = '<div class="card"><div class="card-header"><div class="card-title">Todos os municípios ('+CIDADES.length+')</div></div><p style="font-size:13px;color:#666">Digite no campo de busca para filtrar.</p></div>';
  resultsArea.innerHTML = html;
  resultsArea.scrollIntoView({behavior:'smooth',block:'start'});
}
regionFilter.addEventListener('change', () => {
  const reg = regionFilter.value;
  if(!reg){ listarTodos(); return; }
  renderizar(REGISTROS.filter(r => r.sub_regiao === reg), reg);
});

// ===== RENDERIZAÇÃO =====
function renderizar(regs, titulo){
  if(!regs || regs.length === 0){
    resultsArea.innerHTML = '<div class="card"><div class="card-title">Nenhuma escola encontrada</div><p>Verifique o município ou sub-região.</p></div>';
    return;
  }
  const regiao = regs[0].sub_regiao;
  let html = '<div class="card"><div class="card-header"><span class="card-tag">'+esc(regiao)+'</span><div class="card-title">'+esc(titulo||regiao)+'</div></div>';

  const coords = [...new Map(regs.map(r => [norm(r.email), r])).values()];
  html += '<div class="info-row"><div class="info-icon">👤</div><div><strong>Coordenador(es):</strong><br>' +
    coords.map(c => esc(c.coordenador) + ' — <a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>').join('<br>') +
    '</div></div>';

  const escolas = [...new Map(regs.map(r => [norm(r.escola), r])).values()];
  escolas.forEach(es => {
    const telMatch = (es.endereco||'').match(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/);
    const tel = telMatch ? telMatch[0].replace(/\D/g,'') : '';
    const endSemTel = (es.endereco||'').replace(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/g,'').replace(/[,\s]+$/,'');
    const wa = encodeURIComponent('Olá! Encontrei a '+es.escola+' na Feira do Jovem Aprendiz SENAI-RS e gostaria de mais informações.');
    const map = encodeURIComponent(es.escola+' - RS');
    html += '<div class="escola-box"><strong>'+esc(es.escola)+'</strong>';
    if(endSemTel) html += '<div class="escola-end">📍 '+esc(endSemTel)+'</div>';
    html += '<div class="actions">';
    html += tel ? '<a class="btn-action bg-call" href="tel:+55'+tel+'">📞 Ligar</a>' : '<span class="btn-action bg-call" style="opacity:.4">📞 Ligar</span>';
    html += tel ? '<a class="btn-action bg-wa" href="https://wa.me/55'+tel+'?text='+wa+'" target="_blank" rel="noopener">💬 WhatsApp</a>' : '<span class="btn-action bg-wa" style="opacity:.4">💬 WhatsApp</span>';
    html += '<a class="btn-action bg-map" href="https://www.google.com/maps/search/?api=1&query='+map+'" target="_blank" rel="noopener">🗺️ Mapa</a>';
    html += '<a class="btn-action bg-mail" href="mailto:'+esc(regs[0].email)+'">✉️ E-mail</a>';
    html += '</div></div>';
  });
  html += '</div>';
  resultsArea.innerHTML = html;
  resultsArea.scrollIntoView({behavior:'smooth',block:'start'});
}

// ===== GEOLOCALIZAÇÃO =====
function getLocation(){
  if(!navigator.geolocation){ alert('Seu navegador não suporta geolocalização. Digite o município manualmente.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&accept-language=pt-BR')
        .then(r => r.json())
        .then(d => {
          const raw = d.address && (d.address.city || d.address.town || d.address.municipality || d.address.county) || '';
          const mun = CIDADES.find(c => norm(c) === norm(raw));
          if(mun){ citySearch.value = mun; buscarMunicipio(mun); }
          else alert('Não identificamos seu município. Digite manualmente.');
        })
        .catch(() => alert('Não foi possível identificar sua localização. Digite o município manualmente.'));
    },
    () => alert('Não foi possível acessar sua localização. Digite o município manualmente.'),
    { timeout: 10000 }
  );
}

// ===== INICIALIZAÇÃO =====
carregarDados();
</script>
</body>
</html>
