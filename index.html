<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0033A0">
<meta name="description" content="Localizador de Escolas SENAI-RS - 4ª Feira do Jovem Aprendiz">
<title>SENAI-RS | Encontre sua Escola</title>
<style>
:root{--azul:#0033A0;--laranja:#FF6600;--cinza:#F8F9FA;--texto:#1A1A1A;--branco:#fff;--sombra:0 4px 20px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--cinza);color:var(--texto);line-height:1.5;-webkit-tap-highlight-color:transparent}
header{background:var(--branco);padding:1rem;border-bottom:4px solid var(--azul);box-shadow:var(--sombra);position:sticky;top:0;z-index:50}
.logo{display:flex;justify-content:center;align-items:center;gap:15px}
.logo-senai{font-weight:900;font-size:28px;color:var(--azul);letter-spacing:-1px}
.logo-fiergs{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1px;border-left:1px solid #ddd;padding-left:15px;line-height:1.2}
.banner{background:linear-gradient(135deg,var(--azul),#001f60);color:#fff;padding:40px 20px 60px;text-align:center}
.banner h1{font-size:24px;margin-bottom:8px;font-weight:800}
.container{max-width:650px;margin:0 auto;padding:0 20px 40px}
.card-busca{background:var(--branco);padding:25px;border-radius:16px;box-shadow:var(--sombra);margin-top:-30px}
.campo{position:relative;margin-bottom:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:var(--azul)}
input,select{width:100%;min-height:44px;padding:12px 16px;border:2px solid #E0E0E0;border-radius:10px;font-size:16px;transition:.2s;outline:none}
input:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,51,160,.1)}
.autocomplete{position:absolute;background:var(--branco);width:100%;border:1px solid #ddd;z-index:1000;max-height:250px;overflow-y:auto;border-radius:0 0 10px 10px;box-shadow:var(--sombra)}
.autocomplete-item{padding:14px;cursor:pointer;border-bottom:1px solid #F0F0F0;font-size:15px}
.autocomplete-item:hover{background:#F8F9FA;color:var(--azul)}
.grid-botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.btn{min-height:44px;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-primario{background:var(--azul);color:#fff}
.btn-contorno{background:#fff;border:2px solid var(--azul);color:var(--azul)}
.btn-largo{grid-column:span 2;background:#f0f0f0;color:#444}
.aviso{display:none;background:#FFF3CD;border:1px solid #FFEEBA;color:#664D03;padding:14px 16px;border-radius:10px;margin-top:15px;font-size:14px}
.resultados{margin-top:25px}
.card{background:var(--branco);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--sombra);border-left:8px solid var(--laranja);animation:subir .4s ease-out}
@keyframes subir{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card-cabecalho{margin-bottom:15px;border-bottom:1px solid #EEE;padding-bottom:10px}
.tag{display:inline-block;background:#E3F2FD;color:var(--azul);font-size:11px;font-weight:800;padding:4px 8px;border-radius:4px;text-transform:uppercase;margin-bottom:5px}
.card-titulo{font-size:20px;font-weight:800}
.linha{display:flex;gap:10px;margin-bottom:12px;font-size:14px}
.icone{min-width:20px;color:#777}
.acoes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.btn-acao{font-size:12px;padding:10px;border-radius:8px;color:#fff;text-align:center;text-decoration:none;font-weight:700}
.bg-ligar{background:#28a745}.bg-whats{background:#25D366}.bg-mapa{background:var(--azul)}.bg-email{background:#6c757d}
footer{text-align:center;padding:40px 20px;color:#888;font-size:13px}
@media(max-width:480px){.grid-botoes{grid-template-columns:1fr}.btn-largo{grid-column:span 1}.acoes{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-senai">SENAI</div>
    <div class="logo-fiergs">Sistema<br>FIERGS</div>
  </div>
</header>
<div class="banner">
  <h1>4ª Feira do Jovem Aprendiz</h1>
  <p>Encontre a unidade SENAI mais próxima de você</p>
</div>
<div class="container">
  <div class="card-busca">
    <div class="campo">
      <label for="busca">Busque por Município</label>
      <input type="text" id="busca" placeholder="Ex: Porto Alegre, Caxias..." aria-autocomplete="list">
      <div id="autocomplete" class="autocomplete" hidden></div>
    </div>
    <div class="campo">
      <label for="regiao">Filtrar por Sub-região</label>
      <select id="regiao"><option value="">Todas as sub-regiões</option></select>
    </div>
    <div class="grid-botoes">
      <button class="btn btn-contorno" onclick="minhaLocalizacao()">📍 Minha Localização</button>
      <button class="btn btn-primario" onclick="buscar()">🔍 Buscar</button>
      <button class="btn btn-largo" onclick="listarTodos()">📋 Ver todos os municípios</button>
    </div>
  </div>
  <div id="aviso" class="aviso"></div>
  <div id="resultados" class="resultados"></div>
</div>
<footer>© 2026 SENAI-RS · Sistema FIERGS · 4ª Feira do Jovem Aprendiz</footer>

<script>
let REGISTROS=[], CIDADES=[];
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const $=id=>document.getElementById(id);

function avisar(msg,erro){
  const a=$('aviso'); a.style.display='block'; a.textContent=msg;
  a.style.background=erro?'#F8D7DA':a.style.background; a.style.borderColor=erro?'#F5C6CB':a.style.borderColor; a.style.color=erro?'#721C24':a.style.color;
}

function parseCSV(texto){
  const amostra=texto.slice(0,5000);
  const delim=(amostra.match(/;/g)||[]).length>(amostra.match(/,/g)||[]).length?';':',';
  const linhas=[];let atual='',campo=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(c==='"')campo=!campo;
    else if(c==='\n'&&!campo){linhas.push(atual);atual=''}
    else if(c!=='\r')atual+=c;
  }
  if(atual.trim())linhas.push(atual);
  return linhas.map(l=>{
    const cols=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(ch==='"')q=!q;
      else if(ch===delim&&!q){cols.push(cur.trim());cur=''}
      else cur+=ch;
    }
    cols.push(cur.trim());return cols;
  });
}

function mapear(rows){
  const h=rows[0].map(c=>norm(c));
  if(!h.some(c=>c.includes('MUNICIP')))return{inicio:0,idx:[0,1,2,3,4,5]};
  const achar=n=>h.findIndex(c=>c.includes(n));
  return{inicio:1,idx:[achar('MUNICIP'),achar('SUB'),achar('COORDENADOR'),achar('EMAIL'),achar('ESCOLA'),achar('ENDERECO')]};
}

function carregar(){
  fetch('dados_municipios_senai.csv')
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})
    .then(buf=>{
      let texto=new TextDecoder('utf-8').decode(buf);
      if(texto.indexOf('\uFFFD')!==-1)texto=new TextDecoder('windows-1252').decode(buf);
      texto=texto.replace(/^\uFEFF/,'');
      const rows=parseCSV(texto);
      const{inicio,idx}=mapear(rows);
      const pegar=(r,i)=>i>=0&&r[i]!==undefined?r[i].trim():'';
      REGISTROS=rows.slice(inicio).filter(r=>pegar(r,idx[0])).map(r=>({
        municipio:pegar(r,idx[0]),sub_regiao:pegar(r,idx[1]),
        coordenador:pegar(r,idx[2]),email:pegar(r,idx[3]),
        escola:pegar(r,idx[4]),endereco:pegar(r,idx[5])
      }));
      const mapa=new Map();
      REGISTROS.forEach(r=>{const k=norm(r.municipio);if(!mapa.has(k))mapa.set(k,r.municipio)});
      CIDADES=[...mapa.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      montarRegioes();
      $('aviso').style.display='none';
      console.log('Carregados '+REGISTROS.length+' registros, '+CIDADES.length+' municípios únicos');
    })
    .catch(err=>{
      console.error(err);
      avisar('Não foi possível carregar dados_municipios_senai.csv. Verifique se o arquivo está na mesma pasta e abra a página pelo GitHub Pages (HTTPS), não pelo arquivo local.',true);
    });
}

function montarRegioes(){
  const sel=$('regiao');
  [...new Set(REGISTROS.map(r=>r.sub_regiao))].sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(r=>{
    const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);
  });
}

const busca=$('busca'),autocomplete=$('autocomplete'),regiao=$('regiao'),resultados=$('resultados');
busca.addEventListener('input',()=>{
  const q=norm(busca.value.trim());autocomplete.innerHTML='';autocomplete.hidden=true;
  if(!q)return;
  const m=CIDADES.filter(c=>norm(c).includes(q)).slice(0,8);
  if(!m.length)return;
  autocomplete.hidden=false;
  m.forEach(x=>{
    const d=document.createElement('div');d.className='autocomplete-item';d.textContent=x;
    d.addEventListener('click',()=>{busca.value=x;autocomplete.hidden=true;mostrarMunicipio(x)});
    autocomplete.appendChild(d);
  });
});
document.addEventListener('click',e=>{if(!e.target.closest('.campo'))autocomplete.hidden=true});

function mostrarMunicipio(nome){renderizar(REGISTROS.filter(r=>norm(r.municipio)===norm(nome)),nome)}
function buscar(){
  const q=norm(busca.value.trim());
  if(!q){listarTodos();return}
  renderizar(REGISTROS.filter(r=>norm(r.municipio).includes(q)||norm(r.sub_regiao).includes(q)),busca.value.trim());
}
function listarTodos(){
  resultados.innerHTML='<div class="card"><div class="card-cabecalho"><div class="card-titulo">Todos os municípios ('+CIDADES.length+')</div></div><p style="font-size:13px;color:#666">Digite no campo de busca para filtrar.</p></div>';
  resultados.scrollIntoView({behavior:'smooth',block:'start'});
}
regiao.addEventListener('change',()=>{
  const r=regiao.value;
  if(!r){listarTodos();return}
  renderizar(REGISTROS.filter(x=>x.sub_regiao===r),r);
});

function renderizar(regs,titulo){
  if(!regs||!regs.length){resultados.innerHTML='<div class="card"><div class="card-titulo">Nenhuma escola encontrada</div><p>Verifique o município ou sub-região.</p></div>';return}
  const regiaoAtual=regs[0].sub_regiao;
  let html='<div class="card"><div class="card-cabecalho"><span class="tag">'+esc(regiaoAtual)+'</span><div class="card-titulo">'+esc(titulo||regiaoAtual)+'</div></div>';
  const coords=[...new Map(regs.map(r=>[norm(r.email),r])).values()];
  html+='<div class="linha"><div class="icone">👤</div><div><strong>Coordenador(es):</strong><br>'+coords.map(c=>esc(c.coordenador)+' — <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>').join('<br>')+'</div></div>';
  const escolas=[...new Map(regs.map(r=>[norm(r.escola),r])).values()];
  escolas.forEach(es=>{
    const telMatch=(es.endereco||'').match(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/);
    const tel=telMatch?telMatch[0].replace(/\D/g,''):'';
    const endSemTel=(es.endereco||'').replace(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/g,'').replace(/[,\s]+$/,'');
    const wa=encodeURIComponent('Olá! Encontrei a '+es.escola+' na Feira do Jovem Aprendiz SENAI-RS e gostaria de mais informações.');
    const map=encodeURIComponent(es.escola+' - RS');
    html+='<div><strong>'+esc(es.escola)+'</strong>';
    if(endSemTel)html+='<div style="font-size:13px;color:#555;margin-top:4px">📍 '+esc(endSemTel)+'</div>';
    html+='<div class="acoes">';
    html+=tel?'<a class="btn-acao bg-ligar" href="tel:+55'+tel+'">📞 Ligar</a>':'<span class="btn-acao bg-ligar" style="opacity:.4">📞 Ligar</span>';
    html+=tel?'<a class="btn-acao bg-whats" href="https://wa.me/55'+tel+'?text='+wa+'" target="_blank" rel="noopener">💬 WhatsApp</a>':'<span class="btn-acao bg-whats" style="opacity:.4">💬 WhatsApp</span>';
    html+='<a class="btn-acao bg-mapa" href="https://www.google.com/maps/search/?api=1&query='+map+'" target="_blank" rel="noopener">🗺️ Mapa</a>';
    html+='<a class="btn-acao bg-email" href="mailto:'+esc(regs[0].email)+'">✉️ E-mail</a>';
    html+='</div></div>';
  });
  html+='</div>';
  resultados.innerHTML=html;
  resultados.scrollIntoView({behavior:'smooth',block:'start'});
}

function minhaLocalizacao(){
  if(!navigator.geolocation){alert('Seu navegador não suporta geolocalização. Digite o município manualmente.');return}
  navigator.geolocation.getCurrentPosition(
    p=>{fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+p.coords.latitude+'&lon='+p.coords.longitude+'&accept-language=pt-BR')
      .then(r=>r.json()).then(d=>{
        const raw=d.address&&(d.address.city||d.address.town||d.address.municipality||d.address.county)||'';
        const m=CIDADES.find(c=>norm(c)===norm(raw));
        if(m){busca.value=m;mostrarMunicipio(m)}else alert('Não identificamos seu município. Digite manualmente.');
      }).catch(()=>alert('Não foi possível identificar sua localização. Digite o município manualmente.'));},
    ()=>alert('Não foi possível acessar sua localização. Digite o município manualmente.'),
    {timeout:10000}
  );
}

carregar();
</script>
</body>
</html>
