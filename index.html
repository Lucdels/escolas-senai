<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0033A0">
<meta name="description" content="Localizador de Escolas SENAI-RS - 4ª Feira do Jovem Aprendiz">
<title>SENAI-RS | Encontre sua Escola</title>
<style>
:root{--azul:#0033A0;--laranja:#FF6600;--cinza:#F4F6F8;--texto:#1A1A1A;--branco:#FFF;--sombra:0 4px 20px rgba(0,0,0,.08);--toque:44px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--cinza);color:var(--texto);line-height:1.5;-webkit-tap-highlight-color:transparent}
header{background:var(--branco);padding:1rem;border-bottom:4px solid var(--azul);box-shadow:var(--sombra);position:sticky;top:0;z-index:50}
.logo-container{display:flex;justify-content:center;align-items:center;gap:15px}
.logo-senai{font-weight:900;font-size:28px;color:var(--azul);letter-spacing:-1px}
.logo-fiergs{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1px;border-left:1px solid #ddd;padding-left:15px;line-height:1.2}
.banner{background:linear-gradient(135deg,var(--azul) 0%,#001f60 100%);color:var(--branco);padding:40px 20px 60px;text-align:center}
.banner h1{font-size:24px;margin-bottom:8px;font-weight:800}
.banner p{font-size:15px;opacity:.95}
.container{max-width:650px;margin:0 auto;padding:0 20px 40px}
.search-card{background:var(--branco);padding:25px;border-radius:16px;box-shadow:var(--sombra);margin-top:-30px}
.input-group{position:relative;margin-bottom:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:var(--azul)}
input,select{width:100%;min-height:var(--toque);padding:12px 16px;border:2px solid #E0E0E0;border-radius:10px;font-size:16px;transition:.2s;outline:none;background:#fff}
input:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,51,160,.1)}
.autocomplete-list{position:absolute;background:var(--branco);width:100%;border:1px solid #ddd;z-index:1000;max-height:250px;overflow-y:auto;border-radius:0 0 10px 10px;box-shadow:var(--sombra)}
.autocomplete-item{padding:14px;cursor:pointer;border-bottom:1px solid #F0F0F0;font-size:15px}
.autocomplete-item:hover{background:#F8F9FA;color:var(--azul)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.btn{min-height:var(--toque);padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;transition:transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--azul);color:#fff}
.btn-outline{background:#fff;border:2px solid var(--azul);color:var(--azul)}
.btn-full{grid-column:span 2;background:#f0f0f0;color:#444}
.status{display:none;text-align:center;padding:15px;color:var(--azul);font-weight:600}
.status.active{display:block}
.status.error{color:#b71c1c}
.results{margin-top:25px}
.card{background:var(--branco);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--sombra);border-left:8px solid var(--laranja);animation:slideUp .4s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-header{margin-bottom:15px;border-bottom:1px solid #EEE;padding-bottom:10px}
.card-tag{display:inline-block;background:#E3F2FD;color:var(--azul);font-size:11px;font-weight:800;padding:4px 8px;border-radius:4px;text-transform:uppercase;margin-bottom:5px}
.card-title{font-size:20px;font-weight:800}
.info-row{display:flex;gap:10px;margin-bottom:12px;font-size:14px}
.info-icon{min-width:20px;color:#777}
.info-row a{color:var(--azul);word-break:break-all}
.escola-box{background:#FAFBFC;border:1px solid #EDEFF2;border-radius:10px;padding:12px;margin-bottom:12px}
.escola-box strong{display:block;color:var(--azul);margin-bottom:4px}
.escola-end{font-size:13px;color:#555}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.btn-action{font-size:12px;padding:10px;border-radius:8px;color:#fff;text-align:center;text-decoration:none;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center}
.bg-call{background:#28a745}.bg-wa{background:#25D366}.bg-map{background:var(--azul)}.bg-mail{background:#6c757d}
.qr-section{text-align:center;margin-top:40px;padding:30px;background:#FFF;border-radius:16px;border:2px dashed #DDD}
footer{text-align:center;padding:40px 20px;color:#888;font-size:13px}
@media(max-width:480px){.btn-grid{grid-template-columns:1fr}.btn-full{grid-column:span 1}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo-container">
<div class="logo-senai" aria-label="SENAI">SENAI</div>
<div class="logo-fiergs">Sistema<br>FIERGS</div>
</div>
</header>
<main>
<div class="banner">
<h1>4ª Feira do Jovem Aprendiz</h1>
<p>Encontre a unidade SENAI mais próxima de você</p>
</div>
<div class="container">
<div class="search-card">
<div class="input-group">
<label for="citySearch">Busque por Município</label>
<input type="text" id="citySearch" placeholder="Ex: Porto Alegre, Caxias..." aria-autocomplete="list" autocomplete="off">
<div id="autocompleteList" class="autocomplete-list" hidden></div>
</div>
<div class="input-group">
<label for="regionFilter">Filtrar por Sub-região</label>
<select id="regionFilter"><option value="">Todas as sub-regiões</option></select>
</div>
<div class="btn-grid">
<button class="btn btn-outline" onclick="getLocation()">📍 Minha Localização</button>
<button class="btn btn-primary" onclick="searchByInput()">🔍 Buscar</button>
<button class="btn btn-full" onclick="listarTodos()">📋 Ver todos os municípios</button>
</div>
</div>
<div id="status" class="status">Carregando dados...</div>
<div id="resultsArea" class="results"></div>
<div class="qr-section">
<p style="font-weight:700;margin-bottom:15px">Leve o SENAI com você</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://www.senairs.org.br" alt="QR Code para o site do SENAI" width="140" height="140">
<p style="font-size:12px;color:#999;margin-top:10px">Escaneie para acessar o portal oficial</p>
</div>
</div>
</main>
<footer><p><strong>SENAI Rio Grande do Sul</strong></p><p>Aprendizagem Industrial: o futuro da indústria gaúcha</p></footer>

<script>
// ===== CARREGAMENTO DO CSV COMPLETO (501 registros / 20 sub-regiões) =====
let REGISTROS = [];
let CIDADES = [];
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

// Parser CSV robusto: suporta aspas, ponto-e-vírgula e quebras de linha em campos
function parseCSV(texto){
  const linhas=[]; let atual='', campo=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(c==='"'){ campo=!campo; }
    else if(c==='\n' && !campo){ linhas.push(atual); atual=''; }
    else if(c==='\r' && !campo){ /* ignora */ }
    else { atual+=c; }
  }
  if(atual.trim()) linhas.push(atual);
  return linhas.map(l=>{
    const cols=[]; let cur='', q=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(ch==='"'){ q=!q; }
      else if(ch===';' && !q){ cols.push(cur); cur=''; }
      else{ cur+=ch; }
    }
    cols.push(cur);
    return cols;
  });
}

function carregarDados(){
  const status=document.getElementById('status');
  fetch('dados_municipios_senai.csv')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(texto=>{
      const rows=parseCSV(texto);
      const dados=rows.slice(1).filter(r=>r[0]&&r[0].trim());
      REGISTROS=dados.map(r=>({
        municipio:(r[0]||'').trim(),
        sub_regiao:(r[1]||'').trim(),
        coordenador:(r[2]||'').trim(),
        email:(r[3]||'').trim(),
        escola:(r[4]||'').trim(),
        endereco:(r[5]||'').trim()
      }));
      CIDADES=[...new Set(REGISTROS.map(r=>r.municipio))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      montarFiltroRegioes();
      status.classList.remove('active');
      status.textContent='';
      console.log('Carregados '+REGISTROS.length+' registros, '+CIDADES.length+' municípios únicos');
    })
    .catch(err=>{
      status.classList.add('active','error');
      status.textContent='Não foi possível carregar os dados. Verifique se o arquivo dados_municipios_senai.csv está na mesma pasta e se o app está sendo servido por um servidor web (não funciona abrindo o arquivo direto por duplo clique).';
      console.error(err);
    });
}

function montarFiltroRegioes(){
  const sel=document.getElementById('regionFilter');
  const regs=[...new Set(REGISTROS.map(r=>r.sub_regiao))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  regs.forEach(r=>{
    const o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o);
  });
}

// ===== AUTOCOMPLETE =====
const citySearch=document.getElementById('citySearch');
const autocompleteList=document.getElementById('autocompleteList');
const regionFilter=document.getElementById('regionFilter');
const resultsArea=document.getElementById('resultsArea');

citySearch.addEventListener('input',()=>{
  const q=norm(citySearch.value.trim());
  autocompleteList.innerHTML=''; autocompleteList.hidden=true;
  if(!q) return;
  const matches=CIDADES.filter(c=>c.includes(q)).slice(0,8);
  if(!matches.length) return;
  autocompleteList.hidden=false;
  matches.forEach(m=>{
    const d=document.createElement('div');
    d.className='autocomplete-item';
    d.textContent=m;
    d.addEventListener('click',()=>{ citySearch.value=m; autocompleteList.hidden=true; buscarMunicipio(m); });
    autocompleteList.appendChild(d);
  });
});
document.addEventListener('click',e=>{ if(!e.target.closest('.input-group')) autocompleteList.hidden=true; });

// ===== BUSCA =====
function buscarMunicipio(nome){
  const regs=REGISTROS.filter(r=>norm(r.municipio)===norm(nome));
  renderizar(regs, nome);
}
function searchByInput(){
  const q=norm(citySearch.value.trim());
  if(!q){ listarTodos(); return; }
  const regs=REGISTROS.filter(r=>norm(r.municipio)===q || norm(r.sub_regiao)===q);
  renderizar(regs, citySearch.value.trim());
}
function listarTodos(){
  let html='<div class="card"><div class="card-header"><div class="card-title">Todos os municípios ('+CIDADES.length+')</div></div><p style="font-size:13px;color:#666">Digite no campo de busca para filtrar.</p></div>';
  resultsArea.innerHTML=html;
  resultsArea.scrollIntoView({behavior:'smooth',block:'start'});
}
regionFilter.addEventListener('change',()=>{
  const reg=regionFilter.value;
  if(!reg){ listarTodos(); return; }
  const regs=REGISTROS.filter(r=>r.sub_regiao===reg);
  renderizar(regs, reg);
});

// ===== RENDERIZAÇÃO =====
function renderizar(regs, titulo){
  if(!regs || regs.length===0){
    resultsArea.innerHTML='<div class="card"><div class="card-title">Nenhuma escola encontrada</div><p>Verifique o município ou sub-região.</p></div>';
    return;
  }
  const regiao=regs[0].sub_regiao;
  const munUnicos=[...new Set(regs.map(r=>r.municipio))];
  let html='<div class="card"><div class="card-header"><span class="card-tag">'+esc(regiao)+'</span><div class="card-title">'+esc(titulo||regiao)+'</div></div>';
  // Coordenadores únicos
  const coords=[...new Map(regs.map(r=>[r.email, r])).values()];
  html+='<div class="info-row"><div class="info-icon">👤</div><div><strong>Coordenador(es):</strong><br>'+coords.map(c=>esc(c.coordenador)+' — <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>').join('<br>')+'</div></div>';
  // Escolas únicas
  const escolas=[...new Map(regs.map(r=>[r.escola, r])).values()];
  escolas.forEach(es=>{
    const telMatch=(es.endereco||'').match(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/);
    const tel=telMatch?telMatch[0].replace(/\D/g,''):'';
    const endSemTel=(es.endereco||'').replace(/\(?\d{2}\)?\s?\d{4,5}[-.\s]?\d{4}/g,'').replace(/[,\s]+$/,'');
    const wa=encodeURIComponent('Olá! Encontrei a '+es.escola+' na Feira do Jovem Aprendiz SENAI-RS e gostaria de mais informações.');
    const map=encodeURIComponent(es.escola+' - RS');
    html+='<div class="escola-box"><strong>'+esc(es.escola)+'</strong>';
    if(endSemTel) html+='<div class="escola-end">📍 '+esc(endSemTel)+'</div>';
    html+='<div class="actions">';
    html+= tel?'<a class="btn-action bg-call" href="tel:+55'+tel+'">📞 Ligar</a>':'<span class="btn-action bg-call" style="opacity:.4">📞 Ligar</span>';
    html+= tel?'<a class="btn-action bg-wa" href="https://wa.me/55'+tel+'?text='+wa+'" target="_blank" rel="noopener">💬 WhatsApp</a>':'<span class="btn-action bg-wa" style="opacity:.4">💬 WhatsApp</span>';
    html+='<a class="btn-action bg-map" href="https://www.google.com/maps/search/?api=1&query='+map+'" target="_blank" rel="noopener">🗺️ Mapa</a>';
    html+='<a class="btn-action bg-mail" href="mailto:'+esc(regs[0].email)+'">✉️ E-mail</a>';
    html+='</div></div>';
  });
  html+='</div>';
  resultsArea.innerHTML=html;
  resultsArea.scrollIntoView({behavior:'smooth',block:'start'});
}

// ===== GEOLOCALIZAÇÃO =====
function getLocation(){
  if(!navigator.geolocation){ alert('Seu navegador não suporta geolocalização. Digite o município manualmente.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&accept-language=pt-BR')
        .then(r=>r.json())
        .then(d=>{
          const raw=d.address&&(d.address.city||d.address.town||d.address.municipality||d.address.county)||'';
          const mun=CIDADES.find(c=>norm(c)===norm(raw));
          if(mun){ citySearch.value=mun; buscarMunicipio(mun); }
          else alert('Não identificamos seu município. Digite manualmente.');
        })
        .catch(()=>alert('Não foi possível identificar sua localização. Digite o município manualmente.'));
    },
    ()=>alert('Não foi possível acessar sua localização. Digite o município manualmente.'),
    {timeout:10000}
  );
}

// ===== INICIALIZAÇÃO =====
carregarDados();
</script>
</body>
</html>
